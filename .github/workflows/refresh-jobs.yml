name: Refresh ATS jobs

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    paths:
      - "data/companies.json"
      - "scripts/fetch-ats.mjs"
      - "scripts/fetch-apinfo.mjs"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch ATS boards
        run: node scripts/fetch-ats.mjs

      - name: Fetch ApInfo jobs
        run: node scripts/fetch-apinfo.mjs
        continue-on-error: true

      - name: Commit updated jobs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ats-jobs.json data/apinfo-jobs.json
          if git diff --staged --quiet; then
            echo "No job cache changes"
          else
            git commit -m "chore: refresh ATS + ApInfo job cache"
            git push
          fi
